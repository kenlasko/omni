machine:
  kubelet:
    extraMounts:
    - destination: /var/lib/longhorn
      type: bind
      source: /var/lib/longhorn
      options:
      - bind
      - rshared
      - rw
    - destination: /var/postgresql
      type: bind
      source: /var/postgresql
      options:
      - bind
      - rshared
      - rw
    - destination: /var/testweb
      type: bind
      source: /var/testweb
      options:
      - bind
      - rshared
      - rw
    - destination: /var/backup-temp
      type: bind
      source: /var/backup-temp
      options:
      - bind
      - rshared
      - rw
  install:
    extraKernelArgs:
    - net.ifnames=0
  nodeLabels:
    storage: longhorn                           # Used for specifying which nodes to use for Longhorn.
    intel.feature.node.kubernetes.io/gpu: true  # Used to denote nodes that have an Intel GPU that can be used with the Intel GPU operator. Used for Plex transcoding