machine:
  # network:
  #   interfaces:
  #   - interface: eth0
  #     addresses:
  #     - 10.0.0.153/24
  kubelet:
    extraMounts:
    - destination: /var/adguard/conf
      type: bind
      source: /var/adguard/conf
      options:
      - bind
      - rshared
      - rw
    - destination: /var/adguard/work
      type: bind
      source: /var/adguard/work
      options:
      - bind
      - rshared
      - rw
    - destination: /var/alertmanager
      type: bind
      source: /var/alertmanager
      options:
      - bind
      - rshared
      - rw
    - destination: /var/grafana
      type: bind
      source: /var/grafana
      options:
      - bind
      - rshared
      - rw
    - destination: /var/postgresql
      type: bind
      source: /var/postgresql
      options:
      - bind
      - rshared
      - rw
    - destination: /var/prometheus
      type: bind
      source: /var/prometheus
      options:
      - bind
      - rshared
      - rw
    - destination: /var/redis
      type: bind
      source: /var/redis
      options:
      - bind
      - rshared
      - rw
    - destination: /var/backup-temp
      type: bind
      source: /var/backup-temp
      options:
      - bind
      - rshared
      - rw
    - destination: /var/uptime-kuma
      type: bind
      source: /var/uptime-kuma
      options:
      - bind
      - rshared
      - rw
    - destination: /var/vaultwarden
      type: bind
      source: /var/vaultwarden
      options:
      - bind
      - rshared
      - rw
  install:
    extraKernelArgs:
    - net.ifnames=0