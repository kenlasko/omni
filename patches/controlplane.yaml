machine:
  kubelet:
    extraMounts:
    - destination: /var/postgresql
      type: bind
      source: /var/postgresql
      options:
      - bind
      - rshared
      - rw
  install:
    extraKernelArgs:
    - net.ifnames=0
  network:
    interfaces:
    # Select the NIC by hardware, not name: UKI-booted nodes (e.g. nuc3) ignore
    # install.extraKernelArgs, so net.ifnames=0 doesn't apply and the NIC is enpXsY, not eth0.
    - deviceSelector:
        physical: true
      dhcp: true
      # This enables KubeVIP functionality, which makes the Kube API available on the defined VIP
      # via https://<ipAddress>:6443
      vip:
        ip: 192.168.1.11